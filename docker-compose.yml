# Produktivbetrieb auf einem Server: docker compose up -d --build
services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_USER: leadcenter
      MARIADB_PASSWORD: ${DB_PASSWORD:-PLATZHALTER_db_passwort}
      MARIADB_DATABASE: leadcenter
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - dbdata:/var/lib/mysql

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-PLATZHALTER}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: mysql://leadcenter:${DB_PASSWORD:-PLATZHALTER_db_passwort}@db:3306/leadcenter
    ports:
      - "3000:3000"
    depends_on:
      - db

  worker:
    build:
      context: .
      args:
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-PLATZHALTER}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: mysql://leadcenter:${DB_PASSWORD:-PLATZHALTER_db_passwort}@db:3306/leadcenter
    command: ["npx", "tsx", "src/worker/index.ts"]
    depends_on:
      - app

volumes:
  dbdata:
